name: Build llama.cpp x86_64
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          fetch-depth: 1
      - name: Install deps
        run: sudo apt update && sudo apt install -y cmake build-essential
      - name: Build
        run: |
          cmake -B build -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --config Release --target llama-server -j $(nproc)
      - name: Find all shared libs
        run: find build -name "*.so*" -o -name "llama-server"
      - name: Upload everything under build (bin + lib)
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-x64
          path: |
            build/bin/
            build/lib/
            build/**/*.so
